<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- MƯỢN XƯƠNG LAYOUT TỔNG: Kéo mảnh ghép cấu hình đầu bảng CSS Offline chứa link đĩa cứng Bootstrap 5 -->
    <th:block th:replace="~{fragments/layout :: head('Upload Restaurants')}"></th:block>
</head>

<body class="bg-light">

    <!-- KÉO MẢNH GHÉP: Menu điều hướng đỉnh trang từ kho chứa layout -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container mt-4">
        <!-- KHỐI ROW RESPONSIVE ĐẢM BẢO CHỐT CHẶN CO GIÃN THEO TỶ LỆ PHỄU SẠCH LƯỚI TRÊN MOBILE [2.2] -->
        <div class="row justify-content-center mx-1">
            <div class="col-12 col-md-8 col-lg-6 px-0">
                <!-- LỚP ÁO ĐỒ HỌA BOOTSTRAP 5: Tạo khung hộp Card bo tròn làm mịn góc cạnh, ôm khít lề trên di động [2.2] -->
                <div class="card shadow-sm border-0 rounded-3 bg-white">
                    <div class="card-header bg-primary text-white text-center py-3 rounded-top-3">
                        <!-- VÁ ĐỒ HỌA MÔI TRƯỜNG: Thay tên lửa thô thành mã số vạn năng 🚀 -->
                        <h4 class="mb-0 fw-bold fs-5 fs-sm-4">🚀 CỖ MÁY BĂM NHỎ FILE LÔ</h4>
                    </div>
                    <div class="card-body p-3 p-sm-4">

                        <!--/* BIỂU MẪU ĐẨY LUỒNG STREAM QUA CARD MẠNG */-->
                        <form th:action="@{/restaurants/upload}" method="post" enctype="multipart/form-data">
                            <div class="mb-4">
                                <label for="file" class="form-label fw-bold text-secondary small">Chọn tệp tin dữ liệu
                                    (.json / .ndjson):</label>
                                <input id="file" name="file" type="file"
                                    class="form-control form-control-lg border-2 font-monospace small"
                                    accept=".json,.ndjson" required />
                                <div class="form-text text-muted small mt-1">
                                    * Lưu ý: Hệ thống sẽ tự động băm nhỏ tệp dữ liệu New York thành các lô 10 dòng để
                                    bảo hiểm an toàn RAM [2.2].
                                </div>
                            </div>
                            <div class="d-grid">
                                <!-- VÁ ĐỒ HỌA MÔI TRƯỜNG: Thay ngọn lửa thô thành mã số vạn năng 🔥 -->
                                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm py-2.5 small">
                                    🔥 Kích Nổ Tiến Trình Nạp Lô Vật Lý
                                </button>
                            </div>
                        </form>

                        <!--/* CHỐT CHẶN BẠN CẦU: Hiện hộp thông báo Flash chớp nhoáng từ RAM bọc lót text-wrap tự cuộn dọc [2.2] */-->
                        <div class="alert alert-info border-0 shadow-sm mt-4 mb-0 p-3 text-wrap" th:if="${message}"
                            role="alert">
                            <p class="mb-0 fw-bold text-dark small" th:text="${message}">Dòng thông báo hệ thống</p>
                            <!-- Kích nổ hiển thị số lượng bản ghi lưu đĩa cứng thành công từ hộp record DTO -->
                            <div th:if="${importCount != null}" class="mt-2">
                                <span
                                    class="badge bg-success fs-6 text-wrap fw-bold py-2 px-3 d-block text-center rounded-pill">
                                    Tổng số lượng đã nạp: <span th:text="${importCount}">0</span> nhà hàng New York!
                                </span>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <!-- VÁ ĐỒ HỌA MÔI TRƯỜNG: Thay mũi tên lùi thô thành mã số vạn năng ⬅ -->
                            <a th:href="@{/restaurants}" class="btn btn-outline-secondary btn-sm px-4 py-2 fw-bold">
                                ⬅ Quay Lại Bảng Danh Sách
                            </a>
                        </div>
                    </div> <!--/* THẺ ĐÓNG CARD-BODY */-->
                </div> <!--/* THẺ ĐÓNG CARD */-->
            </div> <!--/* THẺ ĐÓNG COL */-->
        </div> <!--/* THẺ ĐÓNG ROW */-->
    </main>

    <!-- KÉO MẢNH GHÉP: Thanh chân trang footer từ căn kho layout tổng -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- NẠP THƯ VIỆN ĐIỀU KHIỂN LOGIC JS OFFLINE VÀO ĐÁY RAM -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
