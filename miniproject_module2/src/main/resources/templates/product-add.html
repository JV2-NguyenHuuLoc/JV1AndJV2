<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thêm sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 text-success fw-bold mb-4">Thêm sản phẩm mới</h1>
                    <form id="productAddForm" novalidate>
                        <div class="mb-3">
                            <label for="title" class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" id="title" required/>
                            <div class="invalid-feedback" id="titleError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="description" rows="4" required></textarea>
                            <div class="invalid-feedback" id="descriptionError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="price" class="form-label">Giá (USD)</label>
                            <input type="number" class="form-control" id="price" min="1" max="200" step="0.01" required/>
                            <div class="invalid-feedback" id="priceError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Nhóm sản phẩm</label>
                            <input type="text" class="form-control" id="category" placeholder="beauty, fragrances..." required/>
                            <div class="invalid-feedback" id="categoryError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="thumbnail" class="form-label">URL hình ảnh</label>
                            <input type="url" class="form-control" id="thumbnail" required/>
                            <div class="invalid-feedback" id="thumbnailError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="brand" class="form-label">Thương hiệu</label>
                            <input type="text" class="form-control" id="brand" required/>
                            <div class="invalid-feedback" id="brandError"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Thêm sản phẩm</button>
                            <a th:href="@{/home}" class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/product-validation.js}"></script>
<script th:src="@{/js/product-add.js}"></script>
</body>
</html>
