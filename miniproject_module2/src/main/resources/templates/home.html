<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<header class="page-header">
    <div class="container">
        <h1 class="display-5 fw-bold text-success">Fresh Fruits Shop</h1>
        <p class="lead text-muted">Danh sách sản phẩm từ DummyJSON</p>
        <span class="badge bg-success" th:text="'Tổng: ' + ${total} + ' sản phẩm'">Tổng: 0 sản phẩm</span>
        <span class="badge bg-warning text-dark ms-1"
              th:if="${category != null and !category.isBlank()}"
              th:text="'Nhóm: ' + ${category}">Nhóm</span>
    </div>
</header>

<main class="container py-4">
    <!-- TN9 + TN10: thanh sắp xếp, giữ nguyên nhóm đang lọc khi đổi sắp xếp -->
    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/home}">
        <input type="hidden" name="category" th:value="${category}"/>
        <input type="hidden" name="size" th:value="${size}"/>
        <div class="col-auto">
            <label class="form-label mb-1 small text-muted">Sắp xếp theo</label>
            <select class="form-select form-select-sm" name="sortBy">
                <option value="" th:selected="${sortBy == null or sortBy.isBlank()}">Mặc định</option>
                <option value="title" th:selected="${sortBy == 'title'}">Tên</option>
                <option value="price" th:selected="${sortBy == 'price'}">Giá</option>
                <option value="rating" th:selected="${sortBy == 'rating'}">Đánh giá</option>
            </select>
        </div>
        <div class="col-auto">
            <label class="form-label mb-1 small text-muted">Thứ tự</label>
            <select class="form-select form-select-sm" name="order">
                <option value="asc" th:selected="${order == 'asc'}">Tăng dần</option>
                <option value="desc" th:selected="${order == 'desc'}">Giảm dần</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-success">Áp dụng</button>
            <a th:href="@{/home}" class="btn btn-sm btn-outline-secondary"
               th:if="${category != null and !category.isBlank()}">Bỏ lọc nhóm</a>
        </div>
    </form>

    <div class="row g-4" th:if="${total > 0}">
        <div class="col-md-6 col-lg-4 col-xl-3" th:each="product : ${products}">
            <div class="card product-card h-100 shadow-sm">
                <img th:src="${product.thumbnail}" th:alt="${product.title}"
                     class="card-img-top product-img" alt="product"/>
                <div class="card-body d-flex flex-column">
                    <span class="badge bg-light text-success mb-2" th:text="${product.category}">category</span>
                    <h5 class="card-title" th:text="${product.title}">Product title</h5>
                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${#strings.abbreviate(product.description, 100)}">Description</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-success fs-5"
                              th:text="'$' + ${product.price}">$0</span>
                        <a class="btn btn-outline-success btn-sm"
                           th:href="@{/product_detail(id=${product.id})}">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="empty-state text-center" th:if="${total == 0}">
        <h2 class="text-muted">Không có sản phẩm nào</h2>
        <a th:href="@{/home}" class="btn btn-success mt-3">Về trang chủ</a>
    </div>

    <!-- TN8: thanh phân trang dạng: Đầu 1 2 … 5 6 Cuối -->
    <nav class="mt-5" th:if="${totalPages > 1}"
         th:with="windowStart=${currentPage - 2 < 1 ? 1 : currentPage - 2}, windowEnd=${currentPage + 2 > totalPages ? totalPages : currentPage + 2}">
        <ul class="pagination pagination-sm justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/home(category=${category}, page=1, size=${size}, sortBy=${sortBy}, order=${order})}">Đầu</a>
            </li>

            <li class="page-item" th:if="${windowStart > 1}">
                <a class="page-link"
                   th:href="@{/home(category=${category}, page=1, size=${size}, sortBy=${sortBy}, order=${order})}">1</a>
            </li>
            <li class="page-item disabled" th:if="${windowStart > 2}">
                <span class="page-link">…</span>
            </li>

            <li class="page-item" th:each="p : ${#numbers.sequence(windowStart, windowEnd)}"
                th:classappend="${p == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/home(category=${category}, page=${p}, size=${size}, sortBy=${sortBy}, order=${order})}"
                   th:text="${p}">1</a>
            </li>

            <li class="page-item disabled" th:if="${windowEnd < totalPages - 1}">
                <span class="page-link">…</span>
            </li>
            <li class="page-item" th:if="${windowEnd < totalPages}">
                <a class="page-link"
                   th:href="@{/home(category=${category}, page=${totalPages}, size=${size}, sortBy=${sortBy}, order=${order})}"
                   th:text="${totalPages}">N</a>
            </li>

            <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/home(category=${category}, page=${totalPages}, size=${size}, sortBy=${sortBy}, order=${order})}">Cuối</a>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
