<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Fruitables Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" th:href="@{/home}">Fruitables</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/category}">Nhóm sản phẩm</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/product_add}">Thêm sản phẩm</a>
                </li>
            </ul>
            <form class="d-flex search-form" role="search" onsubmit="return false;">
                <input id="searchKeyword" class="form-control form-control-sm me-2" type="search"
                       placeholder="Tìm kiếm sản phẩm..." aria-label="Search"/>
                <button id="searchBtn" class="btn btn-success btn-sm text-nowrap" type="button">Tìm kiếm</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">Mini Project Bài 9 — Spring Boot + Thymeleaf + DummyJSON</p>
        <small class="text-white-50">Theme tham khảo: Fruitables</small>
        <p class="mb-0">CopyRight NGUYỄN HỮU LỘC - JV2M2 - 2026</p>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/search.js}"></script>
</div>

</body>
</html>
